<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comprar Plan | CloudSpace</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#eef4ff;
}

header{
    background:#0b3d91;
    color:white;
    padding:20px;
}

header h1{
    display:inline-block;
}

nav{
    float:right;
    margin-top:8px;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-weight:bold;
}

nav a:hover{
    color:gold;
}

.contenedor{
    width:90%;
    max-width:700px;
    margin:40px auto;
}

.formulario{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0px 0px 15px rgba(0,0,0,.2);
}

.formulario h2{
    text-align:center;
    color:#0b3d91;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    margin-top:25px;
    padding:15px;
    background:#0b3d91;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#28a745;
}

footer{
    background:#0b3d91;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:50px;
}

</style>

</head>

<body>

<header>

<h1>☁ CloudSpace</h1>

<nav>

<a href="index.html">Inicio</a>
<a href="planes.html">Planes</a>
<a href="compras.html">Comprar</a>
<a href="perfil.html">Perfil</a>
<a href="contacto.html">Contacto</a>
<a href="personal.html">personales</a>
<a href="faq.html">FAQ</a>

</nav>

<div style="clear:both;"></div>

</header>

<div class="contenedor">

<div class="formulario">

<h2>Comprar un Plan</h2>

<form onsubmit="return comprar()">

<label>Nombre Completo</label>
<input type="text" id="nombre" required>

<label>Correo Electrónico</label>
<input type="email" id="correo" required>

<label>Seleccione un Plan</label>

<select id="plan">

<option>Gratis - 20 GB</option>
<option>Essential - 200 GB ($5.99)</option>
<option>Pro - 2 TB ($12.99)</option>
<option>Pro Flexi - 16 TB ($32.00)</option>

</select>

<label>Método de Pago</label>

<select>

<option>Tarjeta Visa</option>
<option>MasterCard</option>
<option>PayPal</option>
<option>Yappy</option>

</select>

<label>Número de Tarjeta</label>

<input type="text" maxlength="16" placeholder="1234 5678 9012 3456">

<label>Fecha de Expiración</label>

<input type="month">

<label>CVV</label>

<input type="password" maxlength="3">

<button type="submit">

Confirmar Compra

</button>

</form>

</div>

</div>

<footer>

<h3>CloudSpace © 2026</h3>

<p>Compra segura y protegida.</p>

</footer>

<script>

function comprar(){

let nombre=document.getElementById("nombre").value;

let plan=document.getElementById("plan").value;

alert("Gracias "+nombre+
"\n\nSu compra fue realizada correctamente."+
"\n\nPlan seleccionado: "+plan);

return false;

}

</script>

</body>
</html>
